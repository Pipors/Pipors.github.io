<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GenX Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h1>GenX <span>Team</span></h1>
    <p>Login to your account</p>
    
    <div class="mfield">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="example@team.com">
    </div>
    <div class="mfield">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    
    <div style="color:var(--nii);font-size:12px;margin-bottom:14px;display:none;text-align:left;" id="login-error"></div>
    
    <button class="btn-save" id="btn-login" style="width:100%;margin-top:10px;background:var(--me-bg);color:var(--me);border:1px solid var(--me);">Sign In</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Redirect to app if already logged in
    _supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });

    document.getElementById('btn-login').addEventListener('click', async () => {
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-pass').value.trim();
      const errorEl = document.getElementById('login-error');
      
      if (!email || !password) {
        errorEl.textContent = "Please enter both email and password.";
        errorEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Signing in...';
      errorEl.style.display = 'none';

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        btn.textContent = 'Sign In';
      } else {
        window.location.href = 'index.html';
      }
    });

    // Handle enter key submit
    document.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('btn-login').click();
      }
    });
  </script>
</body>
</html>
