<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GenX Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <div class="login-container">
    <h1>GenX <span>Team</span></h1>
    <p>Login to your account</p>
    
    <div class="mfield">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="example@team.com">
    </div>
    <div class="mfield">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    
    <div style="color:var(--nii);font-size:12px;margin-bottom:14px;display:none;text-align:left;" id="login-error"></div>
    
    <button class="btn-save" id="btn-login" style="width:100%;margin-top:10px;background:var(--me-bg);color:var(--me);border:1px solid var(--me);">Sign In</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
