
<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <h1>GenX <span>Team</span></h1>
      <p id="hdate">— today's tasks</p>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <div class="date-tag" id="dtag"></div>
      <button class="edit-btn" id="btn-logout" style="border-color: var(--nii); color: var(--nii); padding: 6px 14px;">Logout</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="history-section">
    <h2>Task History</h2>
    <div class="history-tabs" id="history-tabs">
      <button class="tab-btn active" data-id="all">All</button>
      <button class="tab-btn" data-id="me">Me</button>
      <button class="tab-btn" data-id="hassan">Hassan</button>
      <button class="tab-btn" data-id="nii">Nii</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-avatar" id="m-avatar"></div>
      <div class="modal-title" id="m-title"></div>
    </div>
    <div class="mfield">
      <label>Task today</label>
      <input type="text" id="f-task" placeholder="What are you working on?">
    </div>
    <div class="mfield">
      <label>Progress — <span id="modal-pct-color">0%</span></label>
      <div class="range-wrap">
        <input type="range" id="f-prog" min="0" max="100" step="5" value="0" style="flex:1">
        <span id="prog-num">0%</span>
      </div>
    </div>
    <div class="mfield">
      <label>Tools used</label>
      <input type="text" id="f-tools" placeholder="Figma, VS Code, Notion...">
    </div>
    <div class="mfield">
      <label>Obstacles</label>
      <textarea id="f-obs" rows="2" placeholder="Any blockers? Leave blank if none."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-save" id="btn-save">Save update</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/script.js"></script>
</body>
</html>
