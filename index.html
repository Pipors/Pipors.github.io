
<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080B12;
  --card:#0E1420;
  --card2:#131929;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.12);
  --text:#F2F4F8;
  --muted:#6B7A99;
  --dim:#3A4560;
  --me:#A78BFA;
  --me-bg:rgba(167,139,250,0.08);
  --me-glow:rgba(167,139,250,0.25);
  --hassan:#34D399;
  --hassan-bg:rgba(52,211,153,0.08);
  --hassan-glow:rgba(52,211,153,0.25);
  --nii:#FB923C;
  --nii-bg:rgba(251,146,60,0.08);
  --nii-glow:rgba(251,146,60,0.25);
}
body{background:var(--bg);font-family:'Syne',sans-serif;color:var(--text);min-height:100vh;padding:28px 20px}

/* grain overlay */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto}

/* Header */
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px}
.header-left h1{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1}
.header-left h1 span{color:var(--me)}
.header-left p{font-size:12px;color:var(--muted);margin-top:6px;font-family:'DM Mono',monospace;letter-spacing:0.04em}
.date-tag{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border2);border-radius:30px;padding:6px 14px;letter-spacing:0.06em}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;transition:transform .2s,box-shadow .3s;cursor:default}
.card:hover{transform:translateY(-3px)}

.card-accent{position:absolute;top:0;left:0;right:0;height:3px}

.card[data-who="me"] .card-accent{background:linear-gradient(90deg,var(--me),#C4B5FD)}
.card[data-who="me"]:hover{box-shadow:0 12px 40px var(--me-glow)}
.card[data-who="hassan"] .card-accent{background:linear-gradient(90deg,var(--hassan),#6EE7B7)}
.card[data-who="hassan"]:hover{box-shadow:0 12px 40px var(--hassan-glow)}
.card[data-who="nii"] .card-accent{background:linear-gradient(90deg,var(--nii),#FCD34D)}
.card[data-who="nii"]:hover{box-shadow:0 12px 40px var(--nii-glow)}

.card-head{padding:20px 20px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}

.avatar{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:0.05em;flex-shrink:0}
.card[data-who="me"] .avatar{background:var(--me-bg);color:var(--me);border:1px solid rgba(167,139,250,0.2)}
.card[data-who="hassan"] .avatar{background:var(--hassan-bg);color:var(--hassan);border:1px solid rgba(52,211,153,0.2)}
.card[data-who="nii"] .avatar{background:var(--nii-bg);color:var(--nii);border:1px solid rgba(251,146,60,0.2)}

.name-info .name{font-size:15px;font-weight:700;letter-spacing:-0.2px}
.name-info .tag{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);margin-top:2px;letter-spacing:0.06em}

.edit-btn{margin-left:auto;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);background:transparent;border:1px solid var(--border2);border-radius:8px;padding:5px 10px;cursor:pointer;transition:all .2s;letter-spacing:0.04em}
.edit-btn:hover{color:var(--text);border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.04)}

.card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:16px}

.field{}
.field-label{font-size:9px;font-family:'DM Mono',monospace;letter-spacing:0.12em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
.field-val{font-size:13px;color:var(--text);line-height:1.5;font-weight:500}
.field-val.empty{color:var(--dim);font-style:italic;font-weight:400}

/* Progress */
.prog-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.prog-pct{font-size:22px;font-weight:800;letter-spacing:-1px;line-height:1}
.card[data-who="me"] .prog-pct{color:var(--me)}
.card[data-who="hassan"] .prog-pct{color:var(--hassan)}
.card[data-who="nii"] .prog-pct{color:var(--nii)}

.prog-track{height:4px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.card[data-who="me"] .prog-fill{background:linear-gradient(90deg,var(--me),#C4B5FD)}
.card[data-who="hassan"] .prog-fill{background:linear-gradient(90deg,var(--hassan),#6EE7B7)}
.card[data-who="nii"] .prog-fill{background:linear-gradient(90deg,var(--nii),#FCD34D)}

/* Tools chips */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:10px;font-family:'DM Mono',monospace;padding:4px 9px;border-radius:6px;letter-spacing:0.04em;border:1px solid var(--border2);color:var(--muted);background:var(--card2)}

/* Obstacle */
.obstacle-box{background:rgba(251,146,60,0.06);border:1px solid rgba(251,146,60,0.15);border-radius:10px;padding:10px 12px;font-size:12px;color:#FCD34D;line-height:1.5}
.obstacle-box.clear{background:rgba(52,211,153,0.06);border-color:rgba(52,211,153,0.15);color:#6EE7B7}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}

.modal{background:#0E1420;border:1px solid var(--border2);border-radius:24px;padding:28px;width:360px;max-width:95vw;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:slideUp .25s cubic-bezier(.4,0,.2,1)}

@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.modal-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.modal-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.modal-title{font-size:16px;font-weight:800;letter-spacing:-0.3px}

.mfield{margin-bottom:14px}
.mfield label{display:block;font-size:9px;font-family:'DM Mono',monospace;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.mfield input,.mfield textarea{width:100%;background:#080B12;border:1px solid var(--border2);border-radius:10px;padding:10px 12px;font-size:13px;font-family:'Syne',sans-serif;color:var(--text);resize:none;transition:border .2s}
.mfield input:focus,.mfield textarea:focus{outline:none;border-color:rgba(255,255,255,0.25)}
.mfield input[type=range]{padding:4px 0;border:none;background:transparent;accent-color:var(--me)}
.range-wrap{display:flex;align-items:center;gap:10px}
.range-wrap span{font-size:18px;font-weight:800;min-width:44px;letter-spacing:-1px}
#modal-pct-color{color:var(--me)}

.modal-actions{display:flex;gap:8px;margin-top:20px}
.btn-save{flex:1;padding:11px;border-radius:12px;font-size:13px;font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;border:none;color:#080B12;transition:opacity .2s}
.btn-save:hover{opacity:.88}
.btn-cancel{padding:11px 18px;border-radius:12px;font-size:13px;font-family:'Syne',sans-serif;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);transition:all .2s}
.btn-cancel:hover{color:var(--text);border-color:rgba(255,255,255,0.25)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="header-left">
      <h1>GenX <span>Team</span></h1>
      <p id="hdate">— today's tasks</p>
    </div>
    <div class="date-tag" id="dtag"></div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-top">
      <div class="modal-avatar" id="m-avatar"></div>
      <div class="modal-title" id="m-title"></div>
    </div>
    <div class="mfield">
      <label>Task today</label>
      <input type="text" id="f-task" placeholder="What are you working on?">
    </div>
    <div class="mfield">
      <label>Progress — <span id="modal-pct-color">0%</span></label>
      <div class="range-wrap">
        <input type="range" id="f-prog" min="0" max="100" step="5" value="0" style="flex:1">
        <span id="prog-num">0%</span>
      </div>
    </div>
    <div class="mfield">
      <label>Tools used</label>
      <input type="text" id="f-tools" placeholder="Figma, VS Code, Notion...">
    </div>
    <div class="mfield">
      <label>Obstacles</label>
      <textarea id="f-obs" rows="2" placeholder="Any blockers? Leave blank if none."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-save" id="btn-save">Save update</button>
    </div>
  </div>
</div>

<script>
const members=[
  {id:'me',   name:'Me',     init:'ME', color:'#A78BFA', bg:'rgba(167,139,250,0.12)', gradient:'linear-gradient(90deg,#A78BFA,#C4B5FD)'},
  {id:'hassan',name:'Hassan',init:'HA', color:'#34D399', bg:'rgba(52,211,153,0.12)',  gradient:'linear-gradient(90deg,#34D399,#6EE7B7)'},
  {id:'nii',  name:'Nii',    init:'NI', color:'#FB923C', bg:'rgba(251,146,60,0.12)',  gradient:'linear-gradient(90deg,#FB923C,#FCD34D)'}
];

let data={me:{},hassan:{},nii:{}};
let editingId=null;

async function load(){
  for(const m of members){
    try{const r=await window.storage.get('gtask_'+m.id);if(r?.value)data[m.id]=JSON.parse(r.value);}catch(e){}
  }
}
async function save(id){try{await window.storage.set('gtask_'+id,JSON.stringify(data[id]));}catch(e){}}

function fmt(d){return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}
function fmtShort(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}

function toolChips(str){
  if(!str)return '<span style="color:var(--dim);font-size:12px;font-style:italic">—</span>';
  return str.split(',').map(t=>`<span class="chip">${t.trim()}</span>`).join('');
}

function render(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  for(const m of members){
    const d=data[m.id];
    const pct=d.progress??0;
    const hasObs=d.obstacles?.trim().length>0;
    g.innerHTML+=`
    <div class="card" data-who="${m.id}">
      <div class="card-accent"></div>
      <div class="card-head">
        <div class="avatar">${m.init}</div>
        <div class="name-info">
          <div class="name">${m.name}</div>
          <div class="tag">team member</div>
        </div>
        <button class="edit-btn" onclick="openModal('${m.id}')">edit ↗</button>
      </div>
      <div class="card-body">
        <div class="field">
          <div class="field-label">Task today</div>
          <div class="field-val ${!d.task?'empty':''}">${d.task||'No task yet'}</div>
        </div>
        <div class="field">
          <div class="field-label">Progress</div>
          <div class="prog-row"><span class="prog-pct">${pct}%</span></div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="field">
          <div class="field-label">Tools</div>
          <div class="chips">${toolChips(d.tools)}</div>
        </div>
        <div class="field">
          <div class="field-label">Obstacles</div>
          <div class="obstacle-box ${hasObs?'':'clear'}">${hasObs?d.obstacles:'✓ No blockers'}</div>
        </div>
      </div>
    </div>`;
  }
}

window.openModal=function(id){
  editingId=id;
  const m=members.find(x=>x.id===id);
  const d=data[id];
  document.getElementById('m-avatar').style.cssText=`background:${m.bg};color:${m.color};border:1px solid ${m.color}33`;
  document.getElementById('m-avatar').textContent=m.init;
  document.getElementById('m-title').textContent='Update — '+m.name;
  document.getElementById('f-task').value=d.task||'';
  document.getElementById('f-prog').value=d.progress??0;
  document.getElementById('prog-num').textContent=(d.progress??0)+'%';
  document.getElementById('modal-pct-color').textContent=(d.progress??0)+'%';
  document.getElementById('modal-pct-color').style.color=m.color;
  document.getElementById('f-tools').value=d.tools||'';
  document.getElementById('f-obs').value=d.obstacles||'';
  document.getElementById('btn-save').style.background=m.gradient;
  document.getElementById('f-prog').style.accentColor=m.color;
  document.getElementById('overlay').classList.add('open');
};

document.getElementById('f-prog').addEventListener('input',function(){
  const v=this.value;
  document.getElementById('prog-num').textContent=v+'%';
  document.getElementById('modal-pct-color').textContent=v+'%';
});

document.getElementById('btn-cancel').addEventListener('click',()=>document.getElementById('overlay').classList.remove('open'));
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))document.getElementById('overlay').classList.remove('open');});

document.getElementById('btn-save').addEventListener('click',async()=>{
  data[editingId]={
    task:document.getElementById('f-task').value.trim(),
    progress:parseInt(document.getElementById('f-prog').value),
    tools:document.getElementById('f-tools').value.trim(),
    obstacles:document.getElementById('f-obs').value.trim()
  };
  await save(editingId);
  document.getElementById('overlay').classList.remove('open');
  render();
});

const now=new Date();
document.getElementById('hdate').textContent='— '+fmt(now);
document.getElementById('dtag').textContent=fmtShort(now);

(async()=>{await load();render();})();
</script>
</body>
</html>
